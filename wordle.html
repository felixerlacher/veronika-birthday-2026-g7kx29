<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Wordle</title>

<style>
:root{
    --bg:#f8f6f0;
    --text:#222;
    --border:#3a3a3c;
    --correct:#538d4e;
    --present:#b59f3b;
    --absent:#3a3a3c;
    --key:#818384;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
	padding:20px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
	background:var(--bg);
    color:var(--text);
	text-align:center;
	overflow-x:hidden;
	display:flex;
    flex-direction:column;
    align-items:center;
	animation:pageFade 0.8s ease-out;
}

@keyframes pageFade{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }
}

h1{
 margin:0;
 font-size:42px;
 font-weight:700;
}

#guessCounter{
 margin:18px 0;
 font-weight:700;
 color:#555;
}

#board{
    display:grid;
    gap:6px;
}

.row{
    display:grid;
    grid-template-columns:repeat(9,58px);
    gap:6px;
}

.tile{
    width:58px;
    height:58px;
    border:2px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2rem;
    font-weight:700;
    text-transform:uppercase;
}

.correct{
    background:var(--correct);
    border-color:var(--correct);
	color:white
}

.present{
    background:var(--present);
    border-color:var(--present);
	color:white
}

.absent{
    background:var(--absent);
    border-color:var(--absent);
	color:white
}

.flip{
    animation:flip .55s ease;
}

@keyframes flip{
    0%{transform:rotateX(0deg);}
    50%{transform:rotateX(90deg);}
    100%{transform:rotateX(0deg);}
}

.shake{
    animation:shake .4s;
}

@keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-8px);}
    80%{transform:translateX(8px);}
}

#message{
    margin-top:15px;
    min-height:24px;
    font-weight:bold;
}

#keyboard{
    margin-top:25px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.key-row{
    display:flex;
    justify-content:center;
    gap:6px;
}

.key{
    min-width:42px;
    height:58px;
    border:none;
    border-radius:4px;
    background:var(--key);
    color:white;
    font-weight:bold;
    cursor:pointer;
	box-shadow:
        inset 0 -2px rgba(0,0,0,.15);
    transition:
        background .15s ease,
        transform .08s ease;
}

.key.large{
    min-width:75px;
}

.key:hover{
    background:#6E7072;
}

.key:active{
    transform:scale(.95) translateY(2px);
    box-shadow:none;
}

#overlay{
    display:none;
	position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    align-items:center;
    justify-content:center;
    z-index:1000;
	padding:20px;
}

.modal{
	background:
        linear-gradient(
            180deg,
            #FFFDF8 0%,
            #FAF3E0 100%
        );
    color:#222;
    width:min(90%,500px);
    padding:30px 24px;
    border-radius:20px;
    text-align:center;
	position:relative;
    overflow:hidden;
	box-shadow:
        0 20px 50px rgba(0,0,0,.25);
	animation:
        modalPop .35s ease-out;
}

@keyframes modalPop{

    0%{
        transform:scale(.7);
        opacity:0;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}

.modal button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.modal h2{
    margin-top:0;
	color:#222;
}

.modal p{
    color:#222;
}

#admireBtn{
    background:#454545;
    color:white;
	border:none;
    border-radius:12px;
    padding:12px 20px;
    margin:5px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
	transition:
        transform .15s,
        background .15s;
}

#admireBtn:hover{
    background:#5A5A5A;
}

#playAgainBtn{
    background:var(--correct);
    color:white;
	border:none;
    border-radius:12px;
    padding:12px 20px;
    margin:5px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
	transition:
        transform .15s,
        background .15s;
}

#playAgainBtn:hover{
    background:#467b43;
}

#confettiCanvas{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:999;
}

@media(max-width:700px){

    .row{
        grid-template-columns:repeat(9,34px);
    }

    .tile{
        width:34px;
        height:34px;
        font-size:1rem;
    }

    .key{
        min-width:26px;
        height:44px;
        font-size:16px;
    }

    .key.large{
        min-width:56px;
    }
}

#solveBadge{
	margin-top:25px;
	font-size:30px;
	font-weight:700;
	color:#c89600;
}

#controls{
    margin-top:15px;
    margin-bottom:15px;
}

#hintBtn{
    background:#d4a017;
    color:white;
    border:none;
    border-radius:12px;
    padding:12px 20px;
    margin:5px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
	transition:
        transform .15s,
        background .15s;
}

#hintBtn:hover{
    transform:translateY(-1px);
    background:#bf9214;
}

.key.hinted{
    outline:4px solid #d4a017;
    outline-offset:1px;
	animation:hintPulse 1.5s ease-in-out infinite;
}

@keyframes hintPulse{
 0%,100%{transform:scale(1);}
 50%{transform:scale(1.02);}
}

#hintBtn:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

#statusBar{
    display:flex;
    gap:20px;
    justify-content:center;
    align-items:center;
    margin-bottom:15px;
    font-weight:bold;
    color:#aaa;
}

#guessCounter,
#hintCounter{
    font-size:18px;
    color:#454545;
    text-align:center;
}

.pop{
    animation:pop .08s ease;
}

@keyframes pop{
    0%{transform:scale(.9);}
    100%{transform:scale(1);}
}

.victory .correct{
    box-shadow:
        0 0 10px rgba(83,141,78,.5);
}

</style>
</head>
<body>

<h1>WORDLE</h1>
<div id="statusBar">
    <div id="guessCounter">🔍 Guesses: 0</div>
    <div id="hintCounter">💡 Hints Used: 0</div>
</div>

<div id="board"></div>
<div id="message"></div>
<div id="keyboard"></div>

<div id="overlay">
    <div class="modal">
        <h2 id="resultTitle"></h2>
        <p id="resultText"></p>

        <button id="admireBtn">
            ✨ Admire Puzzle ✨
        </button>

        <button id="playAgainBtn" onclick="location.reload()">
            Play Again
        </button>
    </div>
</div>

<div id="controls">
    <button id="hintBtn"></button>
</div>

<canvas id="confettiCanvas"></canvas>

<div id="solveBadge"></div>

<script src="words.js"></script>
<script>

const ANSWER = "DATENIGHT";
const WORD_LENGTH = 9;
const MAX_ROWS = 9;
const hintedLetters = new Set();

let currentRow = 0;
let currentGuess = "";
let gameOver = false;
const MAX_HINTS = 3;
let hintsRemaining = MAX_HINTS;

const board = document.getElementById("board");
const keyboard = document.getElementById("keyboard");

for(let r=0;r<MAX_ROWS;r++){

    const row=document.createElement("div");
    row.className="row";

    for(let c=0;c<WORD_LENGTH;c++){

        const tile=document.createElement("div");
        tile.className="tile";

        row.appendChild(tile);
    }

    board.appendChild(row);
}

const keyboardRows=[
"QWERTYUIOP",
"ASDFGHJKL",
"ENTERZXCVBNM⌫"
];

keyboardRows.forEach(def=>{

    const row=document.createElement("div");
    row.className="key-row";

    let i=0;

    while(i<def.length){

        if(def.startsWith("ENTER",i)){
            createKey("ENTER",true,row);
            i+=5;
            continue;
        }

        if(def[i]==="⌫"){
            createKey("⌫",true,row);
            i++;
            continue;
        }

        createKey(def[i],false,row);
        i++;
    }

    keyboard.appendChild(row);
});

function createKey(label,large,row){

    const key=document.createElement("button");

    key.className="key"+(large?" large":"");
    key.textContent=label;

    key.addEventListener("click",()=>{
        handleKey(label);
    });

    row.appendChild(key);
}

function handleKey(key){

    if(gameOver) return;

    if(key==="ENTER"){
        submitGuess();
        return;
    }

    if(key==="⌫"){
        currentGuess=currentGuess.slice(0,-1);
        drawGuess();
        return;
    }

    if(currentGuess.length<WORD_LENGTH){
        currentGuess+=key;
        drawGuess();
    }
}

function drawGuess(){

    const row=board.children[currentRow];

    for(let i=0;i<WORD_LENGTH;i++){

		const tile = row.children[i];
		const newLetter = currentGuess[i] || "";

		if(tile.textContent !== newLetter){

			tile.textContent = newLetter;

			if(newLetter){

				tile.classList.remove("pop");

				void tile.offsetWidth;

				tile.classList.add("pop");
			}

		}
	}
}

function showMessage(text){

    const el=document.getElementById("message");
    el.textContent=text;

    setTimeout(()=>{
        if(el.textContent===text){
            el.textContent="";
        }
    },10000);
}

function shakeRow(){

    const row=board.children[currentRow];

    row.classList.add("shake");

    setTimeout(()=>{
        row.classList.remove("shake");
    },400);
}

function submitGuess(){

    if(currentGuess.length!==WORD_LENGTH){
        showMessage("Enter A 9-Letter Word");
        shakeRow();
		setTimeout(() => {
			currentGuess = "";
			drawGuess();
		}, 400);
        return;
    }

    if(!VALID_WORDS.has(currentGuess)){
        showMessage("Not In Word List");
        shakeRow();
		setTimeout(() => {
			currentGuess = "";
			drawGuess();
		}, 400);
        return;
    }

    const row=board.children[currentRow];

    const answerLetters=ANSWER.split("");
    const guessLetters=currentGuess.split("");

    const results=new Array(WORD_LENGTH).fill("absent");

    for(let i=0;i<WORD_LENGTH;i++){
        if(guessLetters[i]===answerLetters[i]){
            results[i]="correct";
            answerLetters[i]=null;
        }
    }

    for(let i=0;i<WORD_LENGTH;i++){

        if(results[i]==="correct") continue;

        const idx=answerLetters.indexOf(guessLetters[i]);

        if(idx>-1){
            results[i]="present";
            answerLetters[idx]=null;
        }
    }

    for(let i=0;i<WORD_LENGTH;i++){

        const tile=row.children[i];

        setTimeout(()=>{

            tile.classList.add("flip");
            tile.classList.add(results[i]);

            updateKeyboard(guessLetters[i],results[i]);

        },i*200);
    }
	
	currentRow++;
	updateStatusBar();

    if(currentGuess===ANSWER){
        setTimeout(()=>{
            finishGame(true);
        },250*WORD_LENGTH);

        return;
    }
	
    currentGuess="";

    if(currentRow===MAX_ROWS){

        setTimeout(()=>{
            finishGame(false);
        },250*WORD_LENGTH);
    }
}

function updateKeyboard(letter,state){

    document.querySelectorAll(".key").forEach(key=>{

        if(key.textContent!==letter) return;

        const current=getComputedStyle(key).backgroundColor;

        if(state==="correct"){
            key.style.background="#538d4e";
			key.classList.remove("hinted");
        }
        else if(
            state==="present" &&
            current!=="rgb(83, 141, 78)"
        ){
            key.style.background="#b59f3b";
			key.classList.remove("hinted");
        }
        else if(
            state==="absent" &&
            current!=="rgb(83, 141, 78)" &&
            current!=="rgb(181, 159, 59)"
        ){
            key.style.background="#3a3a3c";
        }
    });
}

function finishGame(won){

    gameOver=true;
	const guessesUsed = currentRow;

    document.getElementById("overlay").style.display="flex";

    if(won){

        launchConfetti();
		document.getElementById("board")
			.classList.add("victory");
		
		document.getElementById("solveBadge").textContent =`🎉 Solved In ${guessesUsed} Guesses 🎉`;
		
        document.getElementById("resultTitle").textContent=
            "🎉 Congratulations! 🎉";

        document.getElementById("resultText").innerHTML=
            `You Guessed <strong>DATENIGHT</strong> In <strong>${guessesUsed}</strong> Guesses.`;

        document.getElementById("admireBtn").style.display="block";
		document.getElementById("playAgainBtn").style.display="none";

    }else{

        document.getElementById("resultTitle").textContent=
            "💔 Game Over 💔";

        document.getElementById("resultText").innerHTML=
            "The word was <strong>DATENIGHT</strong>!<br><br>" + 
			"No Datenight For You I Guess...";

        document.getElementById("admireBtn").style.display="none";
    }
}

document.getElementById("admireBtn").addEventListener("click",()=>{
    document.getElementById("overlay").style.display = "none";
});

document.addEventListener("keydown",(e)=>{

    if(gameOver) return;

    if(e.key==="Enter"){
        handleKey("ENTER");
        return;
    }

    if(e.key==="Backspace"){
        handleKey("⌫");
        return;
    }

    if(/^[a-zA-Z]$/.test(e.key)){
        handleKey(e.key.toUpperCase());
    }
});

document.getElementById("hintBtn").addEventListener("click", () => {
    giveHint();
    document.getElementById("hintBtn").blur();
});

function launchConfetti(){

    const canvas=document.getElementById("confettiCanvas");
    const ctx=canvas.getContext("2d");

    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;

    const colors=[
        "#538d4e",
        "#b59f3b",
        "#ff4d6d",
        "#4cc9f0",
        "#f4c542",
        "#9b5de5"
    ];

    const pieces=[];

    for(let i=0;i<250;i++){

        pieces.push({
            x:Math.random()*canvas.width,
            y:-Math.random()*canvas.height,
            size:5+Math.random()*10,
            color:colors[Math.floor(Math.random()*colors.length)],
            speed:2+Math.random()*5,
            drift:-2+Math.random()*4,
            rotation:Math.random()*360,
            spin:-5+Math.random()*10
        });
    }

    let frame=0;

    function animate(){

        ctx.clearRect(0,0,canvas.width,canvas.height);

        pieces.forEach(p=>{

            p.y+=p.speed;
            p.x+=p.drift;
            p.rotation+=p.spin;

            ctx.save();

            ctx.translate(p.x,p.y);
            ctx.rotate(p.rotation*Math.PI/180);

            ctx.fillStyle=p.color;
            ctx.fillRect(
                -p.size/2,
                -p.size/2,
                p.size,
                p.size
            );

            ctx.restore();
        });

        frame++;

        if(frame<300){
            requestAnimationFrame(animate);
        }else{
            ctx.clearRect(0,0,canvas.width,canvas.height);
        }
    }

    animate();
}

function giveHint(){

    if(gameOver) return;
	if(hintsRemaining <= 0){
		showMessage("No Hints Remaining");
		return;
	}

    const solvedLetters = new Set();

	for(let i=0;i<WORD_LENGTH;i++){
		if(board.children[currentRow-1]?.children[i]
			?.classList.contains("correct")){
			solvedLetters.add(ANSWER[i]);
		}
	}

	const availableLetters =
		[...new Set(ANSWER.split(''))]
		.filter(letter => {

			if(hintedLetters.has(letter)) return false;

			const key = [...document.querySelectorAll(".key")]
				.find(k => k.textContent === letter);

			const color = getComputedStyle(key).backgroundColor;

			return (
				color !== "rgb(83, 141, 78)" &&  // green
				color !== "rgb(181, 159, 59)"    // yellow
			);
		});

    if(availableLetters.length === 0){
		
		if(hintsRemaining === 0){
			showMessage("No Hints Remaining");
			return;
		}
		else{
			showMessage("No Viable Hints Remaining");
			return;
		}
    }
	
	hintsRemaining--;
	updateHintButton();
	updateStatusBar();

    const randomLetter =
        availableLetters[
            Math.floor(Math.random() * availableLetters.length)
        ];

    hintedLetters.add(randomLetter);

    document.querySelectorAll(".key").forEach(key => {

        if(key.textContent === randomLetter){

            key.classList.add("hinted");
        }
    });

    showMessage(`The Letter "${randomLetter}" Is In The Word`);
	if(hintsRemaining === 0){
        document.getElementById("hintBtn").disabled = true;
        document.getElementById("hintBtn").textContent =
            "No Hints Left";
    }
}

function updateHintButton(){

    document.getElementById("hintBtn").textContent =
        `Hint (${hintsRemaining})`;
}

function updateStatusBar(){

    document.getElementById("guessCounter").textContent =
        `🔍 Guesses: ${Math.min(currentRow, MAX_ROWS)}`;

    document.getElementById("hintCounter").textContent =
        `💡 Hints Used: ${MAX_HINTS - hintsRemaining}`;
}

window.addEventListener("resize",()=>{

    const canvas=document.getElementById("confettiCanvas");

    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
});

updateHintButton();
updateStatusBar();

</script>
</body>
</html>
