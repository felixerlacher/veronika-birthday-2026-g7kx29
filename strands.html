<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strands - A Trip to Remember</title>

<style>
:root{
 --bg:#f8f6f0;
 --tile:#fff;
 --tile-border:#d8d8d8;
 --selected:#84bfff;
}

*{box-sizing:border-box;}

body{
 margin:0;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 background:var(--bg);
 color:#222;
 overflow-x:hidden;
 animation:pageFade .8s ease-out;
}

#pageContent{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
}

@keyframes pageFade{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }
}

h1{
 margin:0;
 font-size:42px;
 font-weight:700;
}

.clue{
 max-width:420px;
 margin:20px auto;
 padding:14px 20px;
 background:#FCFAF5;
 border:1px solid #ece8de;
 border-radius:14px;
 box-shadow:0 2px 8px rgba(0,0,0,.05);
 font-size:
    clamp(
        15px,
        4vw,
        18px
    );
 font-weight:600;
}

#statusBar{
	display:flex;
    justify-content:center;
    align-items:center;
    gap:24px;
    flex-wrap:wrap;
    margin:18px 0;
    font-weight:bold;
    font-size:18px;
    color:#454545;
}

#boardWrapper,
#grid{
 touch-action:none;
 -webkit-user-select:none;
 user-select:none;
}

#boardWrapper{
    position:relative;
    display:block;
    width:max-content;
    margin-left:auto;
    margin-right:auto;
}

#grid{

    --size:52px;
    --gap:4px;

    display:grid;

    grid-template-columns:
        repeat(8, var(--size));

    gap:var(--gap);

    position:relative;
    z-index:2;
}

#pathOverlay{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 pointer-events:none;
 z-index:1;
 overflow:visible;
}

.cell{
 width:var(--size);
 height:var(--size);

 border-radius:50%;
 border:2px solid var(--tile-border);

 background:white;

 display:flex;
 justify-content:center;
 align-items:center;

 font-size:
    clamp(
    14px,
    calc(var(--size) * .42),
    24px
    );
 font-weight:700;

 cursor:pointer;
}

.cell.selected{
 background:var(--selected);
 border-color:#66a9ef;
 color:white;
}

.cell.found{
 color:white;
 animation:
	foundPop .25s ease-out,
	softGlow 3s ease-in-out infinite;
}

@keyframes softGlow{
    0%,100%{
        filter:brightness(1);
    }
    50%{
        filter:brightness(1.08);
    }
}

.cell.spanagram{
 background:linear-gradient(
 135deg,
 #ffef9a 0%,
 #f3c84b 30%,
 #ffd700 60%,
 #f3c84b 100%
 );

 border-color:#d4a017;

 color:white;

 box-shadow:
    0 0 10px rgba(255,215,0,.7),
    0 0 20px rgba(255,215,0,.45),
    0 0 32px rgba(255,215,0,.25);

 animation:goldSparkle 2s linear infinite;
}

@keyframes goldSparkle{
 0%,100%{
  box-shadow:
   0 0 8px rgba(255,215,0,.5),
   0 0 16px rgba(255,215,0,.2);
 }

 50%{
  box-shadow:
   0 0 12px rgba(255,255,180,.8),
   0 0 24px rgba(255,215,0,.5);
 }
}

.cell.hint{
    animation:hintPulse 1.5s ease-in-out infinite;
}

.cell.hint::after{

    content:"";

    position:absolute;
    inset:-4px;

    border-radius:50%;

    border:4px solid var(--hint-color,#f3c84b);

    box-shadow:
        0 0 8px var(--hint-color,#f3c84b);

    pointer-events:none;
}

.cell{
    position:relative;
}

@keyframes hintPulse{
 0%,100%{transform:scale(1);}
 50%{transform:scale(1.04);}
}

.path-line{
 fill:none;
 stroke-width:8;
 stroke-linecap:round;
 stroke-linejoin:round;
}

.bottom-controls{
 margin-top:20px;
}

#hintBtn{
    background:#d4a017;
    color:white;
    border:none;
    border-radius:12px;
    padding:12px 20px;
    margin:5px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
	transition:
        transform .15s,
        background .15s;
}

#hintBtn:hover{
    transform:translateY(-1px);
    background:#bf9214;
}

button{
 border:none;
 border-radius:999px;
 background:#222;
 color:white;
 padding:12px 22px;
 font-size:16px;
 font-weight:700;
 cursor:pointer;
}

#words{
 display:none;
 max-width:700px;
 margin:30px auto;
 flex-wrap:wrap;
 justify-content:center;
 gap:8px;
}

.word{
 color:white;
 padding:6px 12px;
 border-radius:999px;
 font-size:13px;
 font-weight:700;
}

#victory{
 display:none;
 margin-top:25px;
 font-size:30px;
 font-weight:700;
 color:#c89600;
}

#feedbackBar{
    min-height:24px;
    margin-top:8px;
    color:#888;
    font-weight:600;
    font-size:16px;
	letter-spacing:1px;
	transition:
        color .25s,
        transform .25s;
}

button:disabled{
    background:#bdbdbd;
    color:#fff;
    cursor:not-allowed;
    opacity:.75;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
	align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-content{
    background:
        linear-gradient(
            180deg,
            #FFFDF8 0%,
            #FAF3E0 100%
        );
	color:#222;
    width:min(90%,500px);
    border-radius:20px;
    padding:30px 24px;
    text-align:center;
	position:relative;
    overflow:hidden;
    box-shadow:
        0 20px 50px rgba(0,0,0,.25);
	animation:
        modalPop .35s ease-out;
}

@keyframes modalPop{

    0%{
        transform:scale(.7);
        opacity:0;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}

#confettiCanvas{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:999;
}

.modal-content h2{
    margin-top:0;
	color:#222;
}

.modal-content p{
    color:#222;
}

#admireBtn{
	background:#454545;
    color:white;
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

#admireBtn:hover{
    background:#5A5A5A;
}

button:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

.cell.spanagram{
    animation:foundPop .25s ease-out;
}

@keyframes foundPop{

    0%{
        transform:scale(.65);
    }

    70%{
        transform:scale(1.15);
    }

    100%{
        transform:scale(1);
    }
}

.cell:not(.found):not(.spanagram):hover{
    background:#f1f7ff;
    border-color:#84bfff;
}

</style>
</head>
<body>

<div id="pageContent">
	<h1>STRANDS</h1>
	
	<div class="clue">
	A Trip to Remember
	</div>
	
	<div id="statusBar">
	    <div id="wordsCounter">🔍 Theme Words Found: 0/12</div>
	    <div id="hintCounter">💡 Hints Used: 0</div>
	</div>
	
	<div id="boardWrapper">
	 <svg id="pathOverlay"></svg>
	 <div id="grid"></div>
	</div>
	
	<div class="bottom-controls">
	 <button id="hintBtn">Hint</button>
	</div>
	
	<div id="feedbackBar"></div>
	
	<div id="words"></div>
	
	<div id="victory">
	🎉 Puzzle Complete! 🎉
	</div>
	
	<div id="completionModal" class="modal">
	
	  <div class="modal-content">
		<canvas id="confettiCanvas"></canvas>
	    <h2>🎉 Congratulations! 🎉</h2>
	    <p>
	      You Found Every Theme Word And The Spanagram.
	    </p>
	    <button id="admireBtn">
	      ✨ Admire Puzzle ✨
	    </button>
	  </div>
	
	</div>
</div>

<script>

const board = [
['S','M','L','K','O','I','H','W'],
['U','O','E','N','N','C','I','A'],
['A','O','T','I','H','S','U','S'],
['G','N','S','G','O','E','N','I'],
['N','K','O','E','T','S','N','M'],
['A','I','M','M','O','J','O','A'],
['M','O','U','A','T','A','G','E'],
['A','T','M','E','A','P','I','K'],
['G','I','A','D','T','A','R','A'],
['A','R','I','M','A','N','S','O']
];

const solutionPaths = {

SUMO:[[0,0],[1,0],[0,1],[1,1]],
SUSHI:[[2,7],[2,6],[2,5],[2,4],[2,3]],
MANGA:[[6,0],[5,0],[4,0],[3,0],[2,0]],
ONSEN:[[5,6],[4,6],[4,5],[3,5],[3,6]],
SAKE:[[9,6],[8,7],[7,7],[6,7]],
ORIGAMI:[[9,7],[8,6],[7,6],[6,6],[5,7],[4,7],[3,7]],
KONNICHIWA:[[0,3],[0,4],[1,3],[1,4],[0,5],[1,5],[0,6],[1,6],[0,7],[1,7]],
ARIGATOU:[[9,0],[9,1],[8,1],[8,0],[7,0],[7,1],[6,1],[6,2]],
EDAMAME:[[7,3],[8,3],[8,2],[7,2],[6,3],[5,3],[4,3]],
TATAMI:[[6,4],[7,4],[8,4],[9,4],[9,3],[9,2]],
KIMONO:[[4,1],[5,1],[5,2],[4,2],[3,1],[2,1]],
LETSGOTOJAPAN:[[0,2],[1,2],[2,2],[3,2],[3,3],[3,4],[4,4],[5,4],[5,5],[6,5],[7,5],[8,5],[9,5]]

};

const SPANAGRAM="LETSGOTOJAPAN";

const wordColorMap = {
 SUMO:"#E53935",
 SUSHI:"#FFB6C8",
 MANGA:"#FF4FD8",
 ONSEN:"#9E9E9E",
 SAKE:"#DCC7A1",
 ORIGAMI:"#FF8C42",
 KONNICHIWA:"#8D6E63",
 ARIGATOU:"#9C6ADE",
 EDAMAME:"#66BB6A",
 TATAMI:"#AF804F",
 KIMONO:"#21C7C7",
 LETSGOTOJAPAN:"#F3C84B"
};

const targets=Object.keys(solutionPaths);

const grid=document.getElementById("grid");
const svg=document.getElementById("pathOverlay");

const found=new Set();
const permanentPaths=[];
const hintedWords = new Set();

let dragging=false;
let selected=[];
let hintsUsed = 0;
const MAX_HINTS = 11;

for(let r=0;r<board.length;r++){
 for(let c=0;c<board[r].length;c++){

  const cell=document.createElement("div");

  cell.className="cell";
  cell.textContent=board[r][c];
  cell.dataset.row=r;
  cell.dataset.col=c;

  grid.appendChild(cell);
 }
}

const words=document.getElementById("words");

targets.forEach(word=>{

 const pill=document.createElement("div");

 pill.className="word";
 pill.id="word-"+word;
 pill.textContent=word;
 pill.style.background="#ddd";

 words.appendChild(pill);
});

function normalize(path){
 return path.map(([r,c])=>`${r},${c}`).join("|");
}

function isAdjacent(a,b){

 const r1=+a.dataset.row;
 const c1=+a.dataset.col;

 const r2=+b.dataset.row;
 const c2=+b.dataset.col;

 return (
  Math.abs(r1-r2)<=1 &&
  Math.abs(c1-c2)<=1 &&
  !(r1===r2 && c1===c2)
 );
}

function getCenter(cell){

 const wrap=
 document.getElementById("boardWrapper")
 .getBoundingClientRect();

 const rect=cell.getBoundingClientRect();

 return{
  x:rect.left-wrap.left+rect.width/2,
  y:rect.top-wrap.top+rect.height/2
 };
}

function createSvgPath(cells,color){

 let d="";

 cells.forEach((cell,i)=>{

  const p=getCenter(cell);

  d+=i===0
   ?`M ${p.x} ${p.y}`
   :` L ${p.x} ${p.y}`;
 });

 const path=document.createElementNS(
  "http://www.w3.org/2000/svg",
  "path"
 );

 path.setAttribute("d",d);
 path.setAttribute("class","path-line");

 path.style.stroke=color;
 path.style.filter =
    `drop-shadow(0 0 4px ${color})`;

 if(color==="#F3C84B"){
  path.style.filter=
   "drop-shadow(0 0 6px gold)";
 }

 return path;
}

function redrawPaths(){

 svg.innerHTML="";

 permanentPaths.forEach(item=>{

  svg.appendChild(
   createSvgPath(
    item.cells,
    item.color
   )
  );
 });

 if(selected.length>1){

  svg.appendChild(
   createSvgPath(
    selected,
    "#84bfff"
   )
  );
 }
}

function currentSelectionKey(){

 return selected
 .map(c=>`${c.dataset.row},${c.dataset.col}`)
 .join("|");
}

function updateCurrentSelection(){

    const text =
        selected
            .map(cell => cell.textContent)
            .join("");

    const feedback =
        document.getElementById(
            "feedbackBar"
        );
	feedback.style.color = "#888";
    feedback.textContent = text;
}

function matchWord(){

 const attempt=currentSelectionKey();

 for(const [word,path] of Object.entries(solutionPaths)){

  if(   attempt===normalize(path)){
   return word;
  }
 }

 return null;
}

function updateStatus(){
	document.getElementById("wordsCounter").textContent =
		`🔍 Theme Words Found: ${found.size}/12`;

	document.getElementById("hintCounter").textContent =
		`💡 Hints Used: ${hintsUsed}`;

 if(found.size===12){

    document.getElementById("victory")
        .style.display="block";

    document.getElementById("words")
        .style.display="flex";

    document
        .getElementById("completionModal")
        .classList.add("show");

    const hintButton =
        document.getElementById("hintBtn");

    hintButton.disabled = true;
    hintButton.textContent = "Completed";
	
	launchConfetti();
 }
}

function finishSelection(){
 
 dragging = false;

 if(
  activePointerId !== null &&
  grid.hasPointerCapture(activePointerId)
 ){
  grid.releasePointerCapture(
   activePointerId
  );
 }

 activePointerId = null;
 
 const match=matchWord();

 if(match && !found.has(match)){

  found.add(match);
  updateHintButton();
  
  if(hintedWords.has(match)){

    solutionPaths[match].forEach(([r,c]) => {

        const tile =
            document.querySelector(
                `[data-row="${r}"][data-col="${c}"]`
            );

        if(tile){
            tile.classList.remove("hint");
			tile.style.removeProperty("--hint-color");
        }
    });

    hintedWords.delete(match);
	updateHintButton();
	
	const remainingHints =
		targets.filter(
			word =>
				!found.has(word) &&
				word !== SPANAGRAM &&
				!hintedWords.has(word)
		);

	if(!remainingHints.length){

		const hintButton =
			document.getElementById("hintBtn");

		hintButton.disabled = true;
		hintButton.textContent = "No Hints Left";
	}
 }

  if(navigator.vibrate){
   navigator.vibrate(40);
  }

  const color=wordColorMap[match];

  selected.forEach(cell=>{

   cell.classList.remove("selected");

   if(match===SPANAGRAM){

    cell.classList.add("spanagram");

   }else{

    cell.classList.add("found");

    cell.style.background=color;
    cell.style.borderColor=color;
	cell.style.boxShadow =
	    `0 0 8px ${color}66,
	     0 0 16px ${color}33`;
   }
  });

  permanentPaths.push({
   cells:[...selected],
   color
  });
  
  selected = [];
  dragging = false;
  redrawPaths();

  const pill=
  document.getElementById(
   "word-"+match
  );

  pill.style.background=color;

  const feedback =
    document.getElementById("feedbackBar");

  if(match === SPANAGRAM){
    feedback.style.color = "#d4a017";
    feedback.textContent =
      "🌟 You found the Spanagram! 🌟";
	feedback.animate([
		{transform:"scale(.9)"},
		{transform:"scale(1.1)"},
		{transform:"scale(1)"}
	],{
		duration:250
	});
  }else{
    feedback.style.color = "#555";
    feedback.textContent =
			`Found: ${match}`;
	feedback.animate([
		{transform:"scale(.9)"},
		{transform:"scale(1.1)"},
		{transform:"scale(1)"}
],{
    duration:250
});
  }
  updateStatus();
 }

 else{

  const attemptedWord =
    selected
      .map(cell => cell.textContent)
      .join("");

  selected.forEach(c =>
    c.classList.remove("selected")
  );
  
  const feedback =
        document.getElementById(
            "feedbackBar"
        );
  feedback.style.color = "#555";
  
  if(attemptedWord.length > 1){

    feedback.textContent =
      `Not A Theme Word: ${attemptedWord}`;
    feedback.animate([
		{transform:"scale(.9)"},
		{transform:"scale(1.1)"},
		{transform:"scale(1)"}
	],{
		duration:250
	});
  }
 }
 
 selected=[];
 dragging=false;
 redrawPaths();
}

let activePointerId = null;

grid.addEventListener("pointerdown", e=>{

    if(!e.target.classList.contains("cell"))
        return;

    activePointerId = e.pointerId;

    grid.setPointerCapture(activePointerId);

    selected = [];
    dragging = true;

    selected.push(e.target);

    e.target.classList.add("selected");

    updateCurrentSelection();
    redrawPaths();
});

grid.addEventListener("pointermove",e=>{

 if(!dragging || activePointerId === null)
     return;
 if(selected.length === 0)
     return;

 const element=
 document.elementFromPoint(
  e.clientX,
  e.clientY
 );

 if(
  !element ||
  !element.classList.contains("cell")
 ){
  return;
 }

 const cell=element;

 const last=
 selected[selected.length-1];

 const previous=
 selected[selected.length-2];

 if(previous===cell){

  const removed=
   selected.pop();

  removed.classList.remove(
   "selected"
  );

  updateCurrentSelection();
  return;
 }

 if(
  !selected.includes(cell) &&
  isAdjacent(last,cell)
 ){

  selected.push(cell);

  cell.classList.add(
   "selected"
  );
  
  updateCurrentSelection();

  redrawPaths();
 }
});

grid.addEventListener(
 "pointerup",
 finishSelection
);

grid.addEventListener(
 "pointercancel",
 finishSelection
);

window.addEventListener(
 "resize",
 redrawPaths
);

document
.getElementById("admireBtn")
.addEventListener("click",()=>{

    document
      .getElementById("completionModal")
      .classList.remove("show");

});

document.getElementById("hintBtn")
.addEventListener("click",()=>{
	if(hintsUsed >= MAX_HINTS){
		return;
	}
    const remaining =
        targets.filter(
            word =>
                !found.has(word) &&
                word !== SPANAGRAM &&
				!hintedWords.has(word)
        );
	
    const word =
        remaining[
            Math.floor(
                Math.random() * remaining.length
            )
        ];
	
	hintedWords.add(word);
	hintsUsed++;
	updateStatus();
	updateHintButton();

    solutionPaths[word]
        .forEach(([r,c])=>{

            const tile =
                document.querySelector(
                    `[data-row="${r}"][data-col="${c}"]`
                );

            if(tile){
                tile.classList.add("hint");
				
				tile.style.setProperty(
					"--hint-color",
					wordColorMap[word]
				);
            }
        });

    document.getElementById(
		"feedbackBar"
	).style.color = "#555";

	document.getElementById(
		"feedbackBar"
	).textContent =
        "A Theme Word Has Been Highlighted.";
});

function updateHintButton(){

    const availableHints =
        targets.filter(
            word =>
                !found.has(word) &&
                word !== SPANAGRAM &&
                !hintedWords.has(word)
        );

    const hintButton =
        document.getElementById("hintBtn");

    if(availableHints.length === 0){

        hintButton.disabled = true;
		if(hintsUsed >= MAX_HINTS){
			hintButton.textContent = "No Hints Left";
		}
		else{
			hintButton.textContent = "No Unused Hints Left";
		}

    }else{

        hintButton.disabled = false;
        hintButton.textContent = "Hint";
    }
}

function launchConfetti(){

    const canvas=document.getElementById("confettiCanvas");
    const ctx=canvas.getContext("2d");

    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;

    const colors=[
        "#538d4e",
        "#b59f3b",
        "#ff4d6d",
        "#4cc9f0",
        "#f4c542",
        "#9b5de5"
    ];

    const pieces=[];

    for(let i=0;i<250;i++){

        pieces.push({
            x:Math.random()*canvas.width,
            y:-Math.random()*canvas.height,
            size:5+Math.random()*10,
            color:colors[Math.floor(Math.random()*colors.length)],
            speed:2+Math.random()*5,
            drift:-2+Math.random()*4,
            rotation:Math.random()*360,
            spin:-5+Math.random()*10
        });
    }

    let frame=0;

    function animate(){

        ctx.clearRect(0,0,canvas.width,canvas.height);

        pieces.forEach(p=>{

            p.y+=p.speed;
            p.x+=p.drift;
            p.rotation+=p.spin;

            ctx.save();

            ctx.translate(p.x,p.y);
            ctx.rotate(p.rotation*Math.PI/180);

            ctx.fillStyle=p.color;
            ctx.fillRect(
                -p.size/2,
                -p.size/2,
                p.size,
                p.size
            );

            ctx.restore();
        });

        frame++;

        if(frame<300){
            requestAnimationFrame(animate);
        }else{
            ctx.clearRect(0,0,canvas.width,canvas.height);
        }
    }

    animate();
}

updateStatus();
updateHintButton();

</script>
</body>
</html>
